name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contrato:
    name: Contrato Soroban (cargo test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/greenledger
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/greenledger
      - name: Pruebas unitarias
        run: cargo test --locked
